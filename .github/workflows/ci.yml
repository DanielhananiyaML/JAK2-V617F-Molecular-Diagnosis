name: JAK2 V617F CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Compile Python scripts
        run: python -m compileall -q scripts tests

      - name: Run unit and integrity tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  public-data-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Execute public GSE168368 runtime analysis
        run: python scripts/public_mpn_expression_analysis.py --download --output data/processed/GSE168368_summary.json

      - name: Validate runtime summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/processed/GSE168368_summary.json')
          d = json.loads(p.read_text())
          assert d['accession'] == 'GSE168368'
          assert d['bioproject'] == 'PRJNA707039'
          assert len(d['sample_columns']) == 29
          assert d['group_counts'] == {'PV': 9, 'ET': 12, 'NC': 8}
          print('Runtime validation passed:', d['group_counts'])
          print('Matrix rows:', d['rows'])
          print('SHA256:', d['sha256'])
          PY
